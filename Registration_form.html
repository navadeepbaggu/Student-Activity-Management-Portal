<!DOCTYPE html>
<html lang="en">
<head>
   
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="University Student Activity Management Portal">

    <meta name="author" content="Student">

    <title>Student Event Registration</title>

   <style>
 
/* Registration Section */

#registration {
    max-width: 750px;
    margin: 40px auto;
    padding: 30px;
    background-color: #f4f7fb;
    border-radius: 12px;
    font-family: Arial, sans-serif;
}

#registration h2 {
    text-align: center;
    color: #173b68;
}

#registration > p {
    text-align: center;
    color: #555;
}

#registration fieldset {
    border: 1px solid #b8c7d9;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
}

#registration legend {
    font-weight: bold;
    color: #173b68;
    padding: 5px;
}

#registration label {
    display: inline-block;
    margin: 10px 0;
    font-weight: 600;
}

#registration input:not([type="radio"]):not([type="checkbox"]),
#registration select,
#registration textarea {
    width: 100%;
    padding: 12px;
    margin: 5px 0 15px;
    border: 1px solid #aaa;
    border-radius: 6px;
    box-sizing: border-box;
}

#registration input:focus,
#registration select:focus,
#registration textarea:focus {
    outline: 3px solid #8ab4f8;
    border-color: #174ea6;
}

#registration button {
    padding: 12px 20px;
    border: none;
    border-radius: 6px;
    background-color: #173b68;
    color: white;
    cursor: pointer;
    margin: 5px;
    font-size: 15px;
}

#registration button:hover {
    background-color: #285b95;
}

.form-buttons {
    text-align: center;
}

    </style>
</head>
<body>
    <main>
        
<!-- Registration Section -->
<section id="registration">

    <h2>Student Event Registration</h2>

    <p>Fill in the details below to participate
       in university activities.</p>

    <form action="#" method="post">

        <fieldset>
            <legend>Personal Information</legend>

            <label for="fullname">Full Name <span style="color: red;">*</span></label>
            <input type="text" id="fullname"
                   name="fullname"
                   placeholder="Enter your full name"
                   autocomplete="name"
                   required>

            <label for="studentid">Student ID <span style="color: red;">*</span></label>
            <input type="text" id="studentid"
                   name="studentid"
                   placeholder="Enter your student ID"
                   required>

            <label for="email">Email Address <span style="color: red;">*</span></label>
            <input type="email" id="email"
                   name="email"
                   placeholder="example@gmail.com"
                   autocomplete="email"
                   required>

            <label for="phone">Mobile Number <span style="color: red;">*</span></label>
            <input type="tel" id="phone"
                   name="phone"
                   placeholder="Enter mobile number"
                   autocomplete="tel"
                   required>

        </fieldset>


        <fieldset>
            <legend>Academic Information</legend>

            <label for="department">Department <span style="color: red;">*</span></label>

            <select id="department" name="department" required>
                <option value="">Select your department</option>
                <option value="CSE">Computer Science</option>
                <option value="ECE">Electronics</option>
                <option value="EEE">Electrical</option>
                <option value="MECH">Mechanical</option>
                <option value="CIVIL">Civil</option>
            </select>

            <label for="year">Year of Study <span style="color: red;">*</span></label>

            <select id="year" name="year" required>
                <option value="">Select your year</option>
                <option value="1">First Year</option>
                <option value="2">Second Year</option>
                <option value="3">Third Year</option>
                <option value="4">Fourth Year</option>
            </select>

            <p>Gender <span style="color: red;">*</span></p>

            <input type="radio" id="male"
                   name="gender" value="Male" required>
            <label for="male">Male</label>

            <input type="radio" id="female"
                   name="gender" value="Female">
            <label for="female">Female</label>

            <input type="radio" id="other"
                   name="gender" value="Other">
            <label for="other">Other</label>

        </fieldset>


        <fieldset>
            <legend>Event Selection</legend>

            <p>Select the events you want to participate in:</p>

            <input type="checkbox" id="technical"
                   name="events" value="Technical Fest">
            <label for="technical">Technical Fest</label>

            <br>

            <input type="checkbox" id="sports"
                   name="events" value="Sports Day">
            <label for="sports">Sports Day</label>

            <br>

            <input type="checkbox" id="cultural"
                   name="events" value="Cultural Fest">
            <label for="cultural">Cultural Fest</label>

            <br>

            <input type="checkbox" id="workshop"
                   name="events" value="Workshop">
            <label for="workshop">Technical Workshop</label>

            <br><br>

            <label for="preference">
                Preferred Event Category
            </label>

            <select id="preference" name="preference">
                <option value="">Choose a category</option>
                <option value="Technical">Technical</option>
                <option value="Sports">Sports</option>
                <option value="Cultural">Cultural</option>
            </select>

        </fieldset>


        <fieldset>
            <legend>Additional Information</legend>

            <label for="reason">
                Why do you want to participate?
            </label>
                 <br>
            <textarea id="reason" name="reason"
                      rows="5"
                      placeholder="Tell us about your interests..."></textarea>

        </fieldset>
<br><br>

        <div class="form-buttons">

            <button type="submit">Submit Registration</button>

            <button type="reset">Clear Form</button>

        </div>

    </form>

</section>

    </main>
</body>
</html>
